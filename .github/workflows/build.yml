          cat << 'EOF' > app/src/main/java/com/ttz/ttz/CacheCleanerService.kt
          package com.ttz.ttz

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.Intent
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast

          data class CleanTarget(val appName: String, val packageName: String)

          class CacheCleanerService : AccessibilityService() {
              companion object {
                  var instance: CacheCleanerService? = null
                  var isRunning = false
                  var mode = "CACHE" // "CACHE", "HIBERNATE", or "DEV_SPEED"
                  val queue = mutableListOf<CleanTarget>()
                  var totalToClean = 0
                  var currentIndex = 0
              }

              private val handler = Handler(Looper.getMainLooper())
              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              private var pbOverlay: ProgressBar? = null
              private var tvStepStatus: TextView? = null
              private var tvCount: TextView? = null
              private var tvCurrentApp: TextView? = null
              private var ivOverlayIcon: ImageView? = null
              private var currentTarget: CleanTarget? = null
              private var step = 0
              private var subTick = 0
              private var animIndex = 0

              private val animTargets = listOf(
                  "Window animation scale",
                  "Transition animation scale",
                  "Animator duration scale"
              )

              private val ticker = object : Runnable {
                  override fun run() {
                      if (!isRunning) return
                      subTick++
                      when (mode) {
                          "HIBERNATE" -> runHibernateTick()
                          "DEV_SPEED" -> runDevSpeedTick()
                          else -> runCacheTick()
                      }
                      handler.postDelayed(this, 550)
                  }
              }

              override fun onServiceConnected() { super.onServiceConnected(); instance = this }
              override fun onUnbind(intent: Intent?): Boolean { instance = null; hideOverlay(); return super.onUnbind(intent) }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() { stopProcess() }

              fun startProcess(selectedMode: String) {
                  mode = selectedMode
                  isRunning = true
                  showOverlay()
                  if (mode == "DEV_SPEED") {
                      totalToClean = 3
                      currentIndex = 1
                      step = 0
                      subTick = 0
                      animIndex = 0
                      updateOverlayCustom("1 / 3", "Tuning UI Speed...", "Window animation -> .5x", 25)
                      val intent = Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      }
                      startActivity(intent)
                  } else {
                      if (queue.isEmpty()) { stopProcess(); return }
                      totalToClean = queue.size
                      currentIndex = 0
                      launchNextApp()
                  }
                  handler.removeCallbacks(ticker)
                  handler.postDelayed(ticker, 750)
              }

              fun stopProcess() {
                  isRunning = false
                  queue.clear()
                  handler.removeCallbacks(ticker)
                  hideOverlay()
              }

              private fun showOverlay() {
                  if (overlayView != null) return
                  try {
                      windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_progress, null)
                      pbOverlay = overlayView?.findViewById(R.id.pbOverlay)
                      tvStepStatus = overlayView?.findViewById(R.id.tvStepStatus)
                      tvCount = overlayView?.findViewById(R.id.tvCount)
                      tvCurrentApp = overlayView?.findViewById(R.id.tvCurrentApp)
                      ivOverlayIcon = overlayView?.findViewById(R.id.ivOverlayIcon)
                      overlayView?.findViewById<Button>(R.id.btnStopOverlay)?.setOnClickListener {
                          stopProcess()
                          Toast.makeText(this, "Stopped by user", Toast.LENGTH_SHORT).show()
                      }

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.BOTTOM or Gravity.END
                          x = 24
                          y = 130
                      }
                      windowManager?.addView(overlayView, params)
                  } catch (_: Exception) {}
              }

              private fun updateOverlayUI(stepText: String, progress: Int) {
                  handler.post {
                      val t = currentTarget ?: return@post
                      pbOverlay?.progress = progress
                      tvStepStatus?.text = stepText
                      tvCount?.text = "$currentIndex / $totalToClean"
                      val prefix = if (mode == "HIBERNATE") "Force stop:" else "Clear cache:"
                      tvCurrentApp?.text = "$prefix ${t.appName}"
                      try {
                          ivOverlayIcon?.setImageDrawable(packageManager.getApplicationIcon(t.packageName))
                      } catch (_: Exception) {
                          ivOverlayIcon?.setImageResource(R.drawable.ic_ttz_logo)
                      }
                  }
              }

              private fun updateOverlayCustom(countTxt: String, stepTxt: String, titleTxt: String, progress: Int) {
                  handler.post {
                      tvCount?.text = countTxt
                      tvStepStatus?.text = stepTxt
                      tvCurrentApp?.text = titleTxt
                      pbOverlay?.progress = progress
                      ivOverlayIcon?.setImageResource(R.drawable.ic_ttz_logo)
                  }
              }

              private fun hideOverlay() {
                  handler.post {
                      if (overlayView != null) {
                          try { windowManager?.removeView(overlayView) } catch (_: Exception) {}
                          overlayView = null
                      }
                  }
              }

              private fun launchNextApp() {
                  if (!isRunning || queue.isEmpty()) {
                      stopProcess()
                      Toast.makeText(this, "✅ Task Complete! Your phone is clean & smooth.", Toast.LENGTH_LONG).show()
                      return
                  }
                  currentTarget = queue.removeAt(0)
                  currentIndex++
                  step = 0
                  subTick = 0
                  updateOverlayUI("#1, wait 1s", 20)

                  val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                      data = Uri.parse("package:${currentTarget!!.packageName}")
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  }
                  startActivity(intent)
              }

              // Auto-tunes Developer Options Animation Scales to .5x safely
              private fun runDevSpeedTick() {
                  val root = rootInActiveWindow ?: return
                  if (animIndex >= animTargets.size) {
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      stopProcess()
                      Toast.makeText(this, "⚡ 0.5x Ultra UI Speed Activated!", Toast.LENGTH_LONG).show()
                      return
                  }
                  val currentAnimTitle = animTargets[animIndex]
                  val prog = ((animIndex + 1) * 33)

                  if (step == 0) {
                      updateOverlayCustom("${animIndex + 1} / 3", "Finding setting...", currentAnimTitle, prog)
                      if (findAndClickSafeNode(root, listOf(currentAnimTitle))) {
                          step = 1
                          subTick = 0
                      } else {
                          root.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                          if (subTick > 18) {
                              stopProcess()
                              Toast.makeText(this, "Could not find animation settings. Enable Developer Options first.", Toast.LENGTH_LONG).show()
                          }
                      }
                  } else if (step == 1) {
                      updateOverlayCustom("${animIndex + 1} / 3", "Setting .5x...", currentAnimTitle, prog)
                      if (findAndClickSafeNode(root, listOf(".5x", "0.5x"))) {
                          animIndex++
                          step = 0
                          subTick = 0
                      } else if (subTick > 5) {
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          animIndex++
                          step = 0
                          subTick = 0
                      }
                  }
              }

              private fun runCacheTick() {
                  val root = rootInActiveWindow ?: return
                  if (step == 0) {
                      updateOverlayUI("#$subTick, wait 5s", 40)
                      if (hasNodeText(root, listOf("Clear cache"))) {
                          step = 1; subTick = 0; return
                      }
                      if (findAndClickSafeNode(root, listOf("Storage & cache", "Storage", "Storage usage"))) {
                          step = 1; subTick = 0
                          updateOverlayUI("#3, wait 5s", 70)
                      } else if (subTick > 5) {
                          root.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                      }
                      if (subTick > 10) {
                          step = 2
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          handler.postDelayed({ launchNextApp() }, 450)
                      }
                  } else if (step == 1) {
                      updateOverlayUI("#${subTick + 3}, wait 1s", 90)
                      if (findAndClickSafeNode(root, listOf("Clear cache")) || subTick > 5) {
                          step = 2
                          updateOverlayUI("#9, wait 5s", 100)
                          handler.postDelayed({
                              performGlobalAction(GLOBAL_ACTION_BACK)
                              handler.postDelayed({
                                  performGlobalAction(GLOBAL_ACTION_BACK)
                                  handler.postDelayed({ launchNextApp() }, 450)
                              }, 450)
                          }, 500)
                      }
                  }
              }

              private fun runHibernateTick() {
                  val root = rootInActiveWindow ?: return
                  if (step == 0) {
                      updateOverlayUI("#$subTick, Force Stop", 50)
                      if (findAndClickSafeNode(root, listOf("Force stop"))) {
                          step = 1; subTick = 0
                      } else if (subTick > 4) {
                          step = 2
                          performGlobalAction(GLOBAL_ACTION_BACK)
                          handler.postDelayed({ launchNextApp() }, 450)
                      }
                  } else if (step == 1) {
                      updateOverlayUI("#${subTick + 2}, Confirm OK", 90)
                      if (findAndClickSafeNode(root, listOf("OK", "Force stop")) || subTick > 4) {
                          step = 2
                          updateOverlayUI("Done!", 100)
                          handler.postDelayed({
                              performGlobalAction(GLOBAL_ACTION_BACK)
                              handler.postDelayed({ launchNextApp() }, 450)
                          }, 450)
                      }
                  }
              }

              private fun hasNodeText(root: AccessibilityNodeInfo, keywords: List<String>): Boolean {
                  val list = mutableListOf<AccessibilityNodeInfo>()
                  collectNodes(root, list)
                  return list.any { n ->
                      val t = n.text?.toString() ?: ""
                      keywords.any { kw -> t.equals(kw, ignoreCase = true) || t.contains(kw, ignoreCase = true) }
                  }
              }

              private val forbiddenWords = listOf("Uninstall", "Clear storage", "Clear data", "Manage space", "Delete", "Archive", "Disable", "Format", "Reset")

              private fun findAndClickSafeNode(root: AccessibilityNodeInfo, keywords: List<String>): Boolean {
                  val allNodes = mutableListOf<AccessibilityNodeInfo>()
                  collectNodes(root, allNodes)
                  for (kw in keywords) {
                      for (node in allNodes) {
                          val text = node.text?.toString()?.trim() ?: ""
                          val desc = node.contentDescription?.toString()?.trim() ?: ""
                          if (forbiddenWords.any { f -> text.contains(f, ignoreCase = true) || desc.contains(f, ignoreCase = true) }) {
                              continue
                          }
                          if (text.equals(kw, ignoreCase = true) || text.contains(kw, ignoreCase = true)) {
                              var target: AccessibilityNodeInfo? = node
                              while (target != null && !target.isClickable) target = target.parent
                              if (target != null && target.isEnabled && target.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                                  return true
                              }
                              val rect = Rect()
                              node.getBoundsInScreen(rect)
                              if (!rect.isEmpty && rect.centerX() > 0 && rect.centerY() > 0) {
                                  val path = Path().apply { moveTo(rect.centerX().toFloat(), rect.centerY().toFloat()) }
                                  val gesture = GestureDescription.Builder()
                                      .addStroke(GestureDescription.StrokeDescription(path, 0, 80)).build()
                                  dispatchGesture(gesture, null, null)
                                  return true
                              }
                          }
                      }
                  }
                  return false
              }

              private fun collectNodes(node: AccessibilityNodeInfo?, out: MutableList<AccessibilityNodeInfo>) {
                  if (node == null) return
                  out.add(node)
                  for (i in 0 until node.childCount) collectNodes(node.getChild(i), out)
              }
          }
