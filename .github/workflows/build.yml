# 10. CacheCleanerService.kt (Accessibility Auto-Clicker Logic)
cat << 'EOF' > app/src/main/java/com/ttz/ttz/CacheCleanerService.kt
package com.ttz.ttz

import android.accessibilityservice.AccessibilityService
import android.content.Intent
import android.net.Uri
import android.os.Handler
import android.os.Looper
import android.provider.Settings
import android.view.accessibility.AccessibilityEvent
import android.view.accessibility.AccessibilityNodeInfo
import android.widget.Toast

class CacheCleanerService : AccessibilityService() {

    companion object {
        var isCleaning = false
        val packageQueue = mutableListOf<String>()
        var totalToClean = 0
        var currentIndex = 0
    }

    private val handler = Handler(Looper.getMainLooper())
    private var step = 0 // 0: Find Storage, 1: Find Clear Cache

    override fun onAccessibilityEvent(event: AccessibilityEvent?) {
        if (!isCleaning || event == null) return
        val rootNode = rootInActiveWindow ?: return

        if (step == 0) {
            // Find "Storage & cache" or "Storage"
            if (findAndClick(rootNode, listOf("Storage & cache", "Storage", "Storage usage"))) {
                step = 1
            }
        } else if (step == 1) {
            // Find "Clear cache"
            if (findAndClick(rootNode, listOf("Clear cache"))) {
                step = 2
                handler.postDelayed({
                    performGlobalAction(GLOBAL_ACTION_BACK)
                    handler.postDelayed({
                        performGlobalAction(GLOBAL_ACTION_BACK)
                        processNextApp()
                    }, 600)
                }, 700)
            }
        }
    }

    private fun findAndClick(node: AccessibilityNodeInfo, targets: List<String>): Boolean {
        for (target in targets) {
            val nodes = node.findAccessibilityNodeInfosByText(target)
            for (n in nodes) {
                if (n.text != null && n.text.toString().contains(target, ignoreCase = true)) {
                    var clickable: AccessibilityNodeInfo? = n
                    while (clickable != null && !clickable.isClickable) {
                        clickable = clickable.parent
                    }
                    if (clickable != null && clickable.isEnabled) {
                        clickable.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                        return true
                    }
                }
            }
        }
        return false
    }

    fun startQueue() {
        if (packageQueue.isEmpty()) {
            isCleaning = false
            Toast.makeText(this, "All selected caches cleared!", Toast.LENGTH_LONG).show()
            return
        }
        isCleaning = true
        totalToClean = packageQueue.size
        currentIndex = 0
        processNextApp()
    }

    private fun processNextApp() {
        if (packageQueue.isEmpty()) {
            isCleaning = false
            Toast.makeText(this, "Finished cleaning!", Toast.LENGTH_LONG).show()
            return
        }
        val pkg = packageQueue.removeAt(0)
        currentIndex++
        step = 0
        Toast.makeText(this, "[$currentIndex/$totalToClean] Cleaning: $pkg", Toast.LENGTH_SHORT).show()

        val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
            data = Uri.parse("package:$pkg")
            addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
        }
        startActivity(intent)
    }

    override fun onInterrupt() {
        isCleaning = false
    }

    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
        if (intent?.action == "START_CLEAN") {
            startQueue()
        }
        return super.onStartCommand(intent, flags, startId)
    }
}
EOF

# 11. MainActivity.kt
cat << 'EOF' > app/src/main/java/com/ttz/ttz/MainActivity.kt
package com.ttz.ttz

import android.app.AppOpsManager
import android.app.usage.StorageStatsManager
import android.content.Context
import android.content.Intent
import android.content.pm.ApplicationInfo
import android.graphics.drawable.Drawable
import android.os.Bundle
import android.os.Environment
import android.os.Process
import android.os.StatFs
import android.os.storage.StorageManager
import android.provider.Settings
import android.text.format.Formatter
import android.view.LayoutInflater
import android.view.View
import android.view.ViewGroup
import android.widget.*
import androidx.appcompat.app.AppCompatActivity
import androidx.recyclerview.widget.LinearLayoutManager
import androidx.recyclerview.widget.RecyclerView
import kotlin.concurrent.thread

data class AppCacheItem(
    val appName: String,
    val packageName: String,
    val icon: Drawable,
    val cacheBytes: Long,
    var selected: Boolean = true
)

class MainActivity : AppCompatActivity() {

    private lateinit var tvStorageStats: TextView
    private lateinit var tvTotalCache: TextView
    private lateinit var rvApps: RecyclerView
    private val appList = mutableListOf<AppCacheItem>()
    private lateinit var adapter: AppAdapter

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)

        tvStorageStats = findViewById(R.id.tvStorageStats)
        tvTotalCache = findViewById(R.id.tvTotalCache)
        rvApps = findViewById(R.id.rvApps)

        adapter = AppAdapter(appList)
        rvApps.layoutManager = LinearLayoutManager(this)
        rvApps.adapter = adapter

        updateInternalStorageStats()

        findViewById<Button>(R.id.btnPermissions).setOnClickListener {
            if (!hasUsageStatsPermission()) {
                startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                Toast.makeText(this, "Enable Usage Access for TTZ Cleaner", Toast.LENGTH_LONG).show()
            } else {
                startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                Toast.makeText(this, "Enable TTZ Auto Cache Cleaner in Accessibility", Toast.LENGTH_LONG).show()
            }
        }

        findViewById<Button>(R.id.btnScan).setOnClickListener {
            if (!hasUsageStatsPermission()) {
                Toast.makeText(this, "Please grant Usage Access Permission first!", Toast.LENGTH_SHORT).show()
                startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                return@setOnClickListener
            }
            scanInstalledApps()
        }

        findViewById<Button>(R.id.btnCleanAll).setOnClickListener {
            val selectedApps = appList.filter { it.selected }.map { it.packageName }
            if (selectedApps.isEmpty()) {
                Toast.makeText(this, "Scan and select apps first!", Toast.LENGTH_SHORT).show()
                return@setOnClickListener
            }
            CacheCleanerService.packageQueue.clear()
            CacheCleanerService.packageQueue.addAll(selectedApps)

            val serviceIntent = Intent(this, CacheCleanerService::class.java).apply {
                action = "START_CLEAN"
            }
            startService(serviceIntent)
        }
    }

    private fun updateInternalStorageStats() {
        val stat = StatFs(Environment.getDataDirectory().path)
        val totalBytes = stat.totalBytes
        val availBytes = stat.availableBytes
        val usedBytes = totalBytes - availBytes
        val usedPercent = ((usedBytes.toDouble() / totalBytes.toDouble()) * 100).toInt()

        tvStorageStats.text = "TOTAL: ${Formatter.formatFileSize(this, totalBytes)} | " +
                "USED: ${Formatter.formatFileSize(this, usedBytes)} ($usedPercent%) | " +
                "FREE: ${Formatter.formatFileSize(this, availBytes)}"
    }

    private fun hasUsageStatsPermission(): Boolean {
        val appOps = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
        val mode = appOps.checkOpNoThrow(
            AppOpsManager.OPSTR_GET_USAGE_STATS,
            Process.myUid(),
            packageName
        )
        return mode == AppOpsManager.MODE_ALLOWED
    }

    private fun scanInstalledApps() {
        tvTotalCache.text = "Calculating package sizes..."
        appList.clear()
        adapter.notifyDataSetChanged()

        thread {
            val storageStatsManager = getSystemService(Context.STORAGE_STATS_SERVICE) as StorageStatsManager
            val pm = packageManager
            val packages = pm.getInstalledApplications(0)
            var totalCache = 0L
            val tempList = mutableListOf<AppCacheItem>()

            for (app in packages) {
                try {
                    val stats = storageStatsManager.queryStatsForPackage(
                        StorageManager.UUID_DEFAULT,
                        app.packageName,
                        Process.myUserHandle()
                    )
                    val cache = stats.cacheBytes
                    // Filter out zero/tiny default system cache (< 1MB)
                    if (cache > 1024 * 1024 && app.packageName != packageName) {
                        totalCache += cache
                        tempList.add(
                            AppCacheItem(
                                appName = pm.getApplicationLabel(app).toString(),
                                packageName = app.packageName,
                                icon = pm.getApplicationIcon(app),
                                cacheBytes = cache
                            )
                        )
                    }
                } catch (_: Exception) {
                }
            }

            tempList.sortByDescending { it.cacheBytes }

            runOnUiThread {
                appList.addAll(tempList)
                adapter.notifyDataSetChanged()
                tvTotalCache.text = "LARGE CACHE: ${Formatter.formatFileSize(this, totalCache)} (${appList.size} apps)"
            }
        }
    }

    inner class AppAdapter(private val items: List<AppCacheItem>) :
        RecyclerView.Adapter<AppAdapter.VH>() {

        inner class VH(v: View) : RecyclerView.ViewHolder(v) {
            val ivIcon: ImageView = v.findViewById(R.id.ivIcon)
            val tvAppName: TextView = v.findViewById(R.id.tvAppName)
            val tvCacheSize: TextView = v.findViewById(R.id.tvCacheSize)
            val cbSelect: CheckBox = v.findViewById(R.id.cbSelect)
        }

        override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
            val v = LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false)
            return VH(v)
        }

        override fun onBindViewHolder(holder: VH, position: Int) {
            val item = items[position]
            holder.ivIcon.setImageDrawable(item.icon)
            holder.tvAppName.text = item.appName
            holder.tvCacheSize.text = "Cache ${Formatter.formatFileSize(this@MainActivity, item.cacheBytes)}"
            holder.cbSelect.setOnCheckedChangeListener(null)
            holder.cbSelect.isChecked = item.selected
            holder.cbSelect.setOnCheckedChangeListener { _, isChecked ->
                item.selected = isChecked
            }
        }

        override fun getItemCount(): Int = items.size
    }
}
EOF

