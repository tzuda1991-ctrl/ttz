name: Build TTZ Cleaner Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/ttz/ttz
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TTZCleaner"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ttz.ttz'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ttz.ttz"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName "5.0-UltraPro"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

          # Custom App Logo Vector
          cat << 'EOF' > app/src/main/res/drawable/ic_ttz_logo.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#15192B"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#1E2540"
                  android:pathData="M54,12 A42,42 0 1,1 53.9,12 Z" />
              <path
                  android:strokeColor="#00E5FF"
                  android:strokeWidth="3.5"
                  android:pathData="M54,16 A38,38 0 1,1 53.9,16 Z" />
              <path
                  android:fillColor="#00E676"
                  android:pathData="M58,24 L34,58 L51,58 L46,84 L74,48 L56,48 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1B2030" />
              <corners android:radius="18dp" />
              <stroke android:width="1dp" android:color="#2E3750" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_item_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#171B26" />
              <corners android:radius="14dp" />
              <stroke android:width="1dp" android:color="#252B3B" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_overlay.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
