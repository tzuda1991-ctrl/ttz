          package com.ttz.ttz

          import android.app.ActivityManager
          import android.app.AppOpsManager
          import android.app.usage.StorageStatsManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ApplicationInfo
          import android.graphics.Color
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.os.Environment
          import android.os.Process
          import android.os.StatFs
          import android.os.storage.StorageManager
          import android.provider.Settings
          import android.text.TextUtils
          import android.text.format.Formatter
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlin.concurrent.thread

          data class AppCacheItem(
              val appName: String,
              val packageName: String,
              val icon: Drawable,
              val cacheBytes: Long,
              var selected: Boolean = true,
              var isIgnored: Boolean = false
          )

          class MainActivity : AppCompatActivity() {
              private lateinit var tvStorageStats: TextView
              private lateinit var tvRamStats: TextView
              private lateinit var tvTotalCache: TextView
              private lateinit var pbStorage: ProgressBar
              private lateinit var pbRam: ProgressBar
              private lateinit var rvApps: RecyclerView
              private lateinit var prefs: SharedPreferences
              private val appList = mutableListOf<AppCacheItem>()
              private lateinit var adapter: AppAdapter

              private val criticalPackages = setOf(
                  "android", "com.android.systemui", "com.android.settings",
                  "com.android.phone", "com.android.providers.settings",
                  "com.android.providers.media", "com.google.android.gms"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  prefs = getSharedPreferences("ttz_safe_prefs", Context.MODE_PRIVATE)

                  tvStorageStats = findViewById(R.id.tvStorageStats)
                  tvRamStats = findViewById(R.id.tvRamStats)
                  tvTotalCache = findViewById(R.id.tvTotalCache)
                  pbStorage = findViewById(R.id.pbStorage)
                  pbRam = findViewById(R.id.pbRam)
                  rvApps = findViewById(R.id.rvApps)
                  adapter = AppAdapter(appList)
                  rvApps.layoutManager = LinearLayoutManager(this)
                  rvApps.adapter = adapter

                  refreshDashboardStats()

                  findViewById<Button>(R.id.btnPermissions).setOnClickListener {
                      if (!hasUsageStatsPermission()) {
                          startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                          Toast.makeText(this, "Step 1: Enable Usage Access for TTZ Cleaner", Toast.LENGTH_LONG).show()
                      } else {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                          Toast.makeText(this, "Step 2: Enable TTZ Auto Cache Cleaner", Toast.LENGTH_LONG).show()
                      }
                  }

                  findViewById<Button>(R.id.btnScan).setOnClickListener {
                      if (!hasUsageStatsPermission()) {
                          startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                          return@setOnClickListener
                      }
                      scanSafeUserApps()
                  }

                  findViewById<Button>(R.id.btnRamBoost).setOnClickListener {
                      quickRamBoost()
                  }

                  findViewById<Button>(R.id.btnUiSpeed).setOnClickListener {
                      triggerUiSpeedBoost()
                  }

                  findViewById<Button>(R.id.btnCleanAll).setOnClickListener {
                      triggerAccessibilityTask("CACHE")
                  }

                  findViewById<Button>(R.id.btnHibernateAll).setOnClickListener {
                      triggerAccessibilityTask("HIBERNATE")
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refreshDashboardStats()
              }

              private fun refreshDashboardStats() {
                  val stat = StatFs(Environment.getDataDirectory().path)
                  val used = stat.totalBytes - stat.availableBytes
                  val pct = ((used.toDouble() / stat.totalBytes.toDouble()) * 100).toInt()
                  pbStorage.progress = pct
                  tvStorageStats.text = "${Formatter.formatFileSize(this, used)} / ${Formatter.formatFileSize(this, stat.totalBytes)} ($pct%)"

                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val memInfo = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(memInfo)
                  val usedRam = memInfo.totalMem - memInfo.availMem
                  val ramPct = ((usedRam.toDouble() / memInfo.totalMem.toDouble()) * 100).toInt()
                  pbRam.progress = ramPct
                  tvRamStats.text = "${Formatter.formatFileSize(this, usedRam)} / ${Formatter.formatFileSize(this, memInfo.totalMem)} ($ramPct%)"
              }

              private fun quickRamBoost() {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val memBefore = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }.availMem
                  val pm = packageManager
                  val ignored = prefs.getStringSet("ignored_pkgs", emptySet()) ?: emptySet()
                  var count = 0
                  for (app in pm.getInstalledApplications(0)) {
                      val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                      if (!isSystem && app.packageName != packageName && !ignored.contains(app.packageName)) {
                          try {
                              am.killBackgroundProcesses(app.packageName)
                              count++
                          } catch (_: Exception) {}
                      }
                  }
                  refreshDashboardStats()
                  val memAfter = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }.availMem
                  val freed = if (memAfter > memBefore) memAfter - memBefore else 0L
                  Toast.makeText(this, "🚀 Cleared $count background processes! Freed ${Formatter.formatFileSize(this, freed)}", Toast.LENGTH_LONG).show()
              }

              private fun triggerUiSpeedBoost() {
                  val devEnabled = Settings.Global.getInt(contentResolver, Settings.Global.DEVELOPMENT_SETTINGS_ENABLED, 0) != 0
                  if (!devEnabled) {
                      Toast.makeText(this, "First enable Developer Options (Tap Build Number 7 times in About Phone)", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_DEVICE_INFO_SETTINGS))
                      return
                  }
                  if (!isAccessibilityEnabled()) {
                      Toast.makeText(this, "Turn ON 'TTZ Auto Cache Cleaner' in Accessibility!", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  val svc = CacheCleanerService.instance
                  if (svc == null) {
                      Toast.makeText(this, "Please toggle Accessibility OFF and ON once.", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  svc.startProcess("DEV_SPEED")
              }

              private fun triggerAccessibilityTask(taskMode: String) {
                  if (!isAccessibilityEnabled()) {
                      Toast.makeText(this, "Turn ON 'TTZ Auto Cache Cleaner' in Accessibility!", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  val selected = appList.filter { it.selected && !it.isIgnored }.map { CleanTarget(it.appName, it.packageName) }
                  if (selected.isEmpty()) {
                      Toast.makeText(this, "Tap '🔍 Scan' first to load apps!", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val svc = CacheCleanerService.instance
                  if (svc == null) {
                      Toast.makeText(this, "Please toggle Accessibility OFF and ON once.", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }
                  CacheCleanerService.queue.clear()
                  CacheCleanerService.queue.addAll(selected)
                  svc.startProcess(taskMode)
              }

              private fun isAccessibilityEnabled(): Boolean {
                  val expected = ComponentName(this, CacheCleanerService::class.java)
                  val enabled = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  val splitter = TextUtils.SimpleStringSplitter(':')
                  splitter.setString(enabled)
                  while (splitter.hasNext()) {
                      if (ComponentName.unflattenFromString(splitter.next()) == expected) return true
                  }
                  return false
              }

              private fun hasUsageStatsPermission(): Boolean {
                  val appOps = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  return appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName) == AppOpsManager.MODE_ALLOWED
              }

              private fun scanSafeUserApps() {
                  tvTotalCache.text = "Scanning packages safely..."
                  appList.clear()
                  adapter.notifyDataSetChanged()
                  val ignoredSet = prefs.getStringSet("ignored_pkgs", emptySet())?.toMutableSet() ?: mutableSetOf()

                  thread {
                      val ssm = getSystemService(Context.STORAGE_STATS_SERVICE) as StorageStatsManager
                      val pm = packageManager
                      var totalCache = 0L
                      val temp = mutableListOf<AppCacheItem>()
                      for (app in pm.getInstalledApplications(0)) {
                          try {
                              val pkg = app.packageName
                              if (pkg == packageName || criticalPackages.contains(pkg) || pkg.startsWith("com.android.")) continue

                              val isCoreSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0 &&
                                      (app.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) == 0
                              if (isCoreSystem) continue

                              val cache = ssm.queryStatsForPackage(StorageManager.UUID_DEFAULT, pkg, Process.myUserHandle()).cacheBytes
                              if (cache > 1024 * 1024) {
                                  val isIgn = ignoredSet.contains(pkg)
                                  if (!isIgn) totalCache += cache
                                  temp.add(
                                      AppCacheItem(
                                          appName = pm.getApplicationLabel(app).toString(),
                                          packageName = pkg,
                                          icon = pm.getApplicationIcon(app),
                                          cacheBytes = cache,
                                          selected = !isIgn,
                                          isIgnored = isIgn
                                      )
                                  )
                              }
                          } catch (_: Exception) {}
                      }
                      temp.sortByDescending { it.cacheBytes }
                      runOnUiThread {
                          appList.addAll(temp)
                          adapter.notifyDataSetChanged()
                          tvTotalCache.text = "LARGE CACHE: ${Formatter.formatFileSize(this, totalCache)} (${appList.count { !it.isIgnored }} apps selected)"
                      }
                  }
              }

              private fun toggleIgnore(item: AppCacheItem) {
                  val set = prefs.getStringSet("ignored_pkgs", emptySet())?.toMutableSet() ?: mutableSetOf()
                  if (item.isIgnored) {
                      set.remove(item.packageName)
                      item.isIgnored = false
                      item.selected = true
                  } else {
                      set.add(item.packageName)
                      item.isIgnored = true
                      item.selected = false
                  }
                  prefs.edit().putStringSet("ignored_pkgs", set).apply()
                  adapter.notifyDataSetChanged()
              }

              inner class AppAdapter(private val items: List<AppCacheItem>) : RecyclerView.Adapter<AppAdapter.VH>() {
                  inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                      val ivIcon: ImageView = v.findViewById(R.id.ivIcon)
                      val tvAppName: TextView = v.findViewById(R.id.tvAppName)
                      val tvCacheSize: TextView = v.findViewById(R.id.tvCacheSize)
                      val btnIgnoreToggle: TextView = v.findViewById(R.id.btnIgnoreToggle)
                      val cbSelect: CheckBox = v.findViewById(R.id.cbSelect)
                  }
                  override fun onCreateViewHolder(p: ViewGroup, t: Int) = VH(LayoutInflater.from(p.context).inflate(R.layout.item_app, p, false))
                  override fun onBindViewHolder(h: VH, pos: Int) {
                      val item = items[pos]
                      h.ivIcon.setImageDrawable(item.icon)
                      h.tvAppName.text = if (item.isIgnored) "${item.appName} (Ignored 🛡️)" else item.appName
                      h.tvAppName.setTextColor(if (item.isIgnored) Color.parseColor("#00E676") else Color.WHITE)
                      h.tvCacheSize.text = "Cache: ${Formatter.formatFileSize(this@MainActivity, item.cacheBytes)}"
                      h.btnIgnoreToggle.alpha = if (item.isIgnored) 1.0f else 0.3f
                      h.btnIgnoreToggle.setOnClickListener { toggleIgnore(item) }

                      h.cbSelect.setOnCheckedChangeListener(null)
                      h.cbSelect.isEnabled = !item.isIgnored
                      h.cbSelect.isChecked = item.selected && !item.isIgnored
                      h.cbSelect.setOnCheckedChangeListener { _, c -> item.selected = c }
                  }
                  override fun getItemCount() = items.size
              }
          }
